<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CSR SSR SSG의 초기 UI 생성 위치와 시점 비교</title>
  <desc id="desc">CSR은 브라우저에서 JavaScript를 실행할 때 초기 UI를 렌더링합니다. SSR은 요청 처리 시 서버에서 React로 초기 HTML을 만들고 전달합니다. SSG는 배포 빌드 시 React로 HTML 파일을 미리 만들며 정적 서버나 CDN이 기존 HTML을 전달합니다. 상호작용용 React JavaScript가 포함된 SSR과 SSG 결과는 브라우저에서 기존 HTML에 React를 연결하는 hydration이 이어질 수 있습니다.</desc>
  <metadata>
    직접 제작한 교육용 도식. 외부 이미지, 로고, 제품 UI를 사용하지 않음.
    근거: https://react.dev/reference/react-dom/client/createRoot
    근거: https://react.dev/reference/react-dom/server
    근거: https://react.dev/reference/react-dom/client/hydrateRoot
    근거: https://nextjs.org/docs/pages/building-your-application/rendering/static-site-generation
  </metadata>
  <defs>
