  <text x="760" y="475" class="sans body">코드·asset 변환</text>
  <line x1="842" y1="496" x2="842" y2="514" stroke="#94A3B8" stroke-width="3"/>
  <rect x="700" y="515" width="285" height="65" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
