<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">번들러의 의존성 그래프 분석과 배포 결과</title>
  <desc id="desc">번들러는 entry에서 정적 import와 동적 import 관계를 따라 source dependency graph를 분석하고 코드를 변환하고 최적화합니다. 설정과 동적 import에 따라 배포 결과는 하나 이상의 JavaScript chunk와 CSS, 이미지, 폰트 asset이 될 수 있으며 source module 수와 결과 파일 수는 일대일이 아닙니다.</desc>
  <metadata>
    직접 제작한 교육용 도식. 외부 이미지, 로고, 제품 UI를 사용하지 않음.
    근거: https://vite.dev/guide/#overview
    근거: https://vite.dev/guide/build#chunking-strategy
    근거: https://vite.dev/guide/features.html#static-assets
    근거: https://vite.dev/guide/backend-integration
    근거: https://rolldown.rs/reference/Interface.OutputOptions
  </metadata>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563EB"/>
    </marker>
    <style>
      .sans { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .title { font-size: 52px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-size: 26px; font-weight: 400; fill: #475569; }
      .panel-title { font-size: 29px; font-weight: 800; fill: #0F172A; }
      .node { font-size: 24px; font-weight: 650; fill: #0F172A; }
      .body { font-size: 28px; font-weight: 600; fill: #334155; }
      .small { font-size: 24px; font-weight: 550; fill: #475569; }
      .footer { font-size: 24px; font-weight: 700; fill: #0F172A; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F8FAFC"/>
  <text x="96" y="100" class="sans title">의존성 그래프에서 chunk와 asset까지</text>
  <text x="96" y="150" class="sans subtitle">프로덕션 빌드는 모듈을 분석·변환해 배포할 결과물을 구성합니다.</text>

  <rect x="110" y="220" width="500" height="510" rx="24" fill="#FFFFFF" stroke="#64748B" stroke-width="3"/>
  <text x="360" y="265" text-anchor="middle" class="sans panel-title">Source dependency graph</text>

  <rect x="250" y="290" width="220" height="64" rx="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="360" y="330" text-anchor="middle" class="mono node">src/main.jsx (entry)</text>

  <rect x="145" y="410" width="170" height="60" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <text x="230" y="448" text-anchor="middle" class="mono node">App.jsx</text>
  <rect x="390" y="410" width="170" height="60" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
  <text x="475" y="448" text-anchor="middle" class="mono node">styles.css</text>

  <rect x="125" y="535" width="150" height="58" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <text x="200" y="572" text-anchor="middle" class="mono node">Cart.jsx</text>
