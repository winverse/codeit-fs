  <text x="760" y="568" class="sans small">미사용 export 제거</text>
  <line x1="842" y1="581" x2="842" y2="599" stroke="#94A3B8" stroke-width="3"/>
  <rect x="700" y="600" width="285" height="55" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="730" cy="627" r="17" fill="#2563EB"/>
  <text x="730" y="635" text-anchor="middle" class="sans" font-size="21" font-weight="800" fill="#FFFFFF">4</text>
  <text x="760" y="635" class="sans body">압축·chunk 분할</text>

  <line x1="1020" y1="475" x2="1070" y2="475" stroke="#2563EB" stroke-width="7" marker-end="url(#arrow-blue)"/>

  <rect x="1080" y="220" width="410" height="510" rx="24" fill="#FFFFFF" stroke="#64748B" stroke-width="3"/>
  <text x="1285" y="265" text-anchor="middle" class="sans panel-title">배포 결과 (예시)</text>
  <rect x="1120" y="305" width="330" height="105" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="1285" y="349" text-anchor="middle" class="sans body" font-weight="800">entry chunk · JS</text>
  <text x="1285" y="384" text-anchor="middle" class="sans small">하나 이상의 JS 결과</text>
