  <text x="760" y="400" class="sans body">의존성 분석</text>
  <line x1="842" y1="421" x2="842" y2="439" stroke="#94A3B8" stroke-width="3"/>
  <rect x="700" y="440" width="285" height="55" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="730" cy="467" r="17" fill="#2563EB"/>
